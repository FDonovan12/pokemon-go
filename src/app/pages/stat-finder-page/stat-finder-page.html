<div class="stat-finder-page">
    <div class="stat-finder-page__header">
        <button
            class="add-card-button"
            (click)="store.addCard()"
        >
            + Ajouter une carte
        </button>
    </div>

    <div
        cdkDropList
        class="stat-finder-list"
        (cdkDropListDropped)="onDrop($event)"
    >
        @for (card of store.cards(); track card.id) {
            <div
                cdkDrag
                class="drag-wrapper"
            >
                <app-stat-finder-card [card]="card" />
            </div>
        }
    </div>
</div>
