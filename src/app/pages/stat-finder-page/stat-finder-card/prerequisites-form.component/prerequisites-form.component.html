<div class="prerequisites-form">
    <div class="field-row">
        <div class="form-field">
            <label for="prerequisites-level">Niveau</label>
            <app-dropdown
                [value]="prerequisites().level ?? null"
                [items]="levels"
                inputType="number"
                (valueChange)="onLevelChange($event)"
                (selected)="onLevelChange($event.value)"
                [id]="'prerequisites-level'"
            >
                <ng-template
                    #item
                    let-level
                >
                    {{ level.label }}
                </ng-template>
            </app-dropdown>
        </div>

        <label>
            PC
            <input
                type="number"
                min="10"
                [value]="prerequisites().cp ?? ''"
                (input)="onCpChange($event)"
                placeholder="Tous"
            />
        </label>
    </div>

    <div class="iv-section">
        <div class="field-row">
            <div class="segmented">
                <button
                    type="button"
                    [class.active]="prerequisites().iv.mode === 'common'"
                    (click)="setIvMode('common')"
                >
                    Commun
                </button>
                <button
                    type="button"
                    [class.active]="prerequisites().iv.mode === 'separate'"
                    (click)="setIvMode('separate')"
                >
                    Séparé
                </button>
            </div>

            <div class="segmented">
                <button
                    type="button"
                    [class.active]="prerequisites().iv.comparison === 'exact'"
                    (click)="setIvComparison('exact')"
                >
                    Exact
                </button>
                <button
                    type="button"
                    [class.active]="prerequisites().iv.comparison === 'min'"
                    (click)="setIvComparison('min')"
                >
                    Minimum
                </button>
            </div>
        </div>

        @if (prerequisites().iv.mode === 'common') {
            <label>
                IV {{ prerequisites().iv.comparison === 'min' ? '(minimum)' : '' }}
                <input
                    type="number"
                    min="0"
                    max="15"
                    [value]="prerequisites().iv.common ?? ''"
                    (input)="onIvCommonChange($event)"
                    placeholder="Tous"
                />
            </label>
        } @else {
            <div class="field-row">
                <label>
                    Att.
                    <input
                        type="number"
                        min="0"
                        max="15"
                        [value]="prerequisites().iv.atk ?? ''"
                        (input)="onIvStatChange('atk', $event)"
                        placeholder="Tous"
                    />
                </label>
                <label>
                    Déf.
                    <input
                        type="number"
                        min="0"
                        max="15"
                        [value]="prerequisites().iv.def ?? ''"
                        (input)="onIvStatChange('def', $event)"
                        placeholder="Tous"
                    />
                </label>
                <label>
                    End.
                    <input
                        type="number"
                        min="0"
                        max="15"
                        [value]="prerequisites().iv.sta ?? ''"
                        (input)="onIvStatChange('sta', $event)"
                        placeholder="Tous"
                    />
                </label>
            </div>
        }
    </div>
</div>
