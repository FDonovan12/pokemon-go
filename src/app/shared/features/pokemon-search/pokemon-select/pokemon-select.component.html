<app-dropdown
    [value]="store.search()"
    [items]="store.searchResults()"
    [placeholder]="placeHolder()"
    (valueChange)="onSearch($event ?? '')"
    (selected)="select($event)"
>
    <ng-template
        #item
        let-pokemon
    >
        <app-image-pokemon [pokemon]="pokemon"></app-image-pokemon>
        {{ pokemon.slug.titleCase() }}
    </ng-template>
</app-dropdown>
